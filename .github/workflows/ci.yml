name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: this job only builds and tests — it never writes to the
# repo, releases, or the GITHUB_TOKEN-backed APIs. Pin to read-only so a
# compromised dependency can't push commits or mint packages.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      # Third-party actions are pinned to a full commit SHA (not a mutable
      # tag) so a hijacked tag can't silently alter the build. The trailing
      # comment records the human-readable version; bump both together.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          # Pin to a specific Xcode version so a new stable release on the
          # macOS runner can't silently break the build. Bump deliberately.
          xcode-version: "16.2"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: make project

      # The generated .xcodeproj is committed (developers open it without
      # XcodeGen). If regeneration changes it, someone edited project.yml
      # without running `make project` — or hand-edited project.pbxproj.
      # Fail loudly instead of shipping a project that silently diverges
      # from its source of truth.
      - name: Verify committed project matches project.yml
        run: |
          git diff --exit-code -- Afterwords.xcodeproj/project.pbxproj || {
            echo "ERROR: project.pbxproj is stale. Run 'make project' and commit the result."
            exit 1
          }

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Verify GitHub Pages assets
        run: |
          test -f docs/index.html         || (echo "ERROR: docs/index.html missing" && exit 1)
          test -s docs/index.html         || (echo "ERROR: docs/index.html is empty" && exit 1)
          test -f docs/favicons/og-app.png || (echo "ERROR: docs/favicons/og-app.png missing" && exit 1)
          test -s docs/favicons/og-app.png || (echo "ERROR: docs/favicons/og-app.png is empty" && exit 1)
          echo "GitHub Pages assets: OK"

      - name: Verify appcast + release tooling
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
          python3 scripts/release_lib.py validate appcast.xml
          echo "appcast + release_lib: OK"
